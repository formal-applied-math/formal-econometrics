[econometrics]

[econometrics.lean]
# Path to the Lake project the Lean backend elaborates against. The project's
# own ``lakefile.lean`` (Mathlib pin) + ``lake-manifest.json`` (transitive
# freeze) + ``lean-toolchain`` are authoritative. Benchmark snippets just
# `import Econometrics.X` and reference compiled lemmas. Path is relative to the
# CWD when the verifier runs.
local_project = "."

[econometrics.orchestrator]
default_timeout = 60.0
